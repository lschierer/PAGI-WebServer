server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Don't include port in redirects (we're behind App Runner's load balancer)
    port_in_redirect off;
    absolute_redirect off;

    # Extensionless URL support
    try_files $uri $uri/index.html =404;

    # Public routes — no auth
    location / { }
    location /css/ { }
    location /images/ { }
    location /js/ { }

    # Protected routes — basic auth
    location /Library/ {
        auth_basic "Luke's Library";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
}
